<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Task Adaptation workflow, narrow layout</title><desc id="desc">OBSERVE: New feedback → PROPOSE: Bounded revision → DECIDE: Accept or reject → RECHECK: Fresh evidence</desc><rect width="1200" height="900" rx="22" fill="#0b1220"/><text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#c4b5fd" font-weight="700">HOW IT WORKS</text><rect x="48" y="106" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="152" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#c4b5fd" font-weight="700">01  OBSERVE</text><text x="76" y="211" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">New feedback</text><path d="M600 260v22m-8-8 8 8 8-8" stroke="#c4b5fd" stroke-width="4" fill="none"/><rect x="48" y="289" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="335" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#c4b5fd" font-weight="700">02  PROPOSE</text><text x="76" y="394" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Bounded revision</text><path d="M600 443v22m-8-8 8 8 8-8" stroke="#c4b5fd" stroke-width="4" fill="none"/><rect x="48" y="472" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="518" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#c4b5fd" font-weight="700">03  DECIDE</text><text x="76" y="577" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Accept or reject</text><path d="M600 626v22m-8-8 8 8 8-8" stroke="#c4b5fd" stroke-width="4" fill="none"/><rect x="48" y="655" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="701" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#c4b5fd" font-weight="700">04  RECHECK</text><text x="76" y="760" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Fresh evidence</text></svg>
